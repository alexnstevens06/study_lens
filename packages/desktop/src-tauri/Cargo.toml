[package]
name = "study-partner"
version = "0.1.0"
description = "Study Partner desktop shell"
authors = ["Alex Stevens"]
edition = "2021"
license = "MIT"

[lib]
name = "study_partner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
